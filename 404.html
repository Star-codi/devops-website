<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — DevOps Zero to Hero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&family=Space+Grotesk:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#020408;--surface:#060d1a;--border2:#0f2850;--cyan:#00f5d4;--text:#8fb3cc;--heading:#e8f4ff;--muted:#1e3a5a;--font-display:'Orbitron',monospace;--font-body:'Space Grotesk',sans-serif;--font-mono:'JetBrains Mono',monospace}
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:var(--font-body);min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
    body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,245,212,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,245,212,.025) 1px,transparent 1px);background-size:60px 60px;pointer-events:none;z-index:0}
    .wrap{max-width:480px;position:relative;z-index:1}
    .code{font-family:var(--font-display);font-size:96px;font-weight:800;line-height:1;color:var(--cyan);text-shadow:0 0 40px rgba(0,245,212,.4);margin-bottom:16px}
    h1{font-family:var(--font-display);font-size:1.1rem;font-weight:700;color:var(--heading);letter-spacing:.1em;margin-bottom:12px;text-transform:uppercase}
    p{font-size:.9rem;color:var(--text);line-height:1.7;margin-bottom:32px}
    .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
    a.btn{padding:10px 24px;border-radius:2px;font-family:var(--font-mono);font-size:.7rem;font-weight:600;text-decoration:none;transition:opacity .15s,transform .1s;letter-spacing:.08em;text-transform:uppercase}
    a.btn:hover{opacity:.85;transform:translateY(-1px)}
    a.primary{background:var(--cyan);color:#000}
    a.secondary{background:transparent;color:var(--text);border:1px solid var(--border2)}
    .terminal{background:#020810;border:1px solid var(--border2);border-radius:2px;padding:16px 20px;margin-bottom:32px;font-family:var(--font-mono);font-size:.72rem;color:#7ec8a0;text-align:left;line-height:1.9;position:relative;overflow:hidden}
    .terminal::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,var(--cyan),transparent);opacity:.25}
    .prompt{color:var(--muted)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>Looks like this page doesn't exist — or it was moved.<br>Let's get you back on track.</p>
    <div class="terminal">
      <div><span class="prompt">$ </span>curl devopsbuddy.in/this-page</div>
      <div style="color:#ff2d55">Error 404: Not Found</div>
      <div style="margin-top:8px"><span class="prompt">$ </span>cd / && ls modules/</div>
      <div style="color:var(--cyan)">docker  kubernetes  terraform  ansible  monitoring ...</div>
    </div>
    <div class="btns">
      <a href="/" class="btn primary">← Back to Home</a>
      <a href="https://github.com/Star-codi/devops-website/issues" target="_blank" class="btn secondary">Report an Issue</a>
    </div>
  </div>
</body>
</html>
